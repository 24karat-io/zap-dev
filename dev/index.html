  <!--
    Installed iOS Home Screen web app: draw edge to edge, under the status bar.
    With "default", iOS reserves the status-bar area and draws its own
    translucent bar/edge effect over the top of the page (the whitish band over
    the community header). "black-translucent" + `viewport-fit=cover` (added
    below for standalone mode only) lets Flutter paint under the status bar and
    report the inset as MediaQuery.viewPadding.top. This meta tag only affects
    the installed web app, never a browser tab.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* See the script below: let Flutter's host element (body) cover the whole
       screen in the installed iOS web app instead of the shortened viewport.
       It must not be position:fixed, which iOS clips to that viewport. */
    html.ios-webapp-full-height, html.ios-webapp-full-height body {
      overflow: hidden !important;
    }
    html.ios-webapp-full-height body {
      position: absolute !important;
      bottom: auto !important;
      height: 100vh !important;
      height: 100lvh !important;
    }
  </style>
  <script>
    // Opt into `viewport-fit=cover` only when running as an installed iOS web
    // app, so browser-tab rendering (and its safe-area insets) stays unchanged.
    // Runs synchronously while <head> is parsed, before Flutter boots; Flutter
    // carries the descriptor over to the viewport meta tag it writes and then
    // reads env(safe-area-inset-*) into MediaQuery.viewPadding.
    (function () {
      // navigator.standalone is defined only by iOS Safari. Android installed web
      // apps already fit the screen, and none of the workarounds below apply to
      // them (they pushed the bottom navigation bar off screen there).
      if (window.navigator.standalone !== true) return;
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta && !/viewport-fit\s*=/.test(meta.content)) {
        meta.content += ', viewport-fit=cover';
      }

      // iOS 26+ installed web app + black-translucent: the page is drawn under
      // the status bar, but documentElement.clientHeight is short by the status
      // bar height (e.g. 797 of 844pt, 894 of 956pt) while 100lvh is the full
      // screen. innerHeight and visualViewport.height are short too on some
      // launches and correct on others (seen on iOS 27). Flutter sizes its view
      // from clientHeight / visualViewport.height, so the app ended above the
      // bottom edge, or below it when a fixed amount was added to an already
      // correct value. Top each value up by its own shortfall; it is 0 wherever
      // the viewport is correct. The visual viewport's shortfall is measured on
      // innerHeight, which keeps its size while the keyboard is open.
      try {
        var root = document.documentElement;
        var clientHeight = Object.getOwnPropertyDescriptor(Element.prototype, 'clientHeight');
        if (!clientHeight || !clientHeight.get) return;
        var probe = document.createElement('div');
        probe.setAttribute('aria-hidden', 'true');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100vh;' +
          'height:100lvh;visibility:hidden;pointer-events:none';
        root.appendChild(probe);
        var shortfall = function (height) {
          var missing = probe.getBoundingClientRect().height - height;
          return missing >= 1 ? missing : 0;
        };
        Object.defineProperty(root, 'clientHeight', {
          configurable: true,
          get: function () {
            var height = clientHeight.get.call(this);
            return height + shortfall(height);
          }
        });
        var vv = window.visualViewport;
        var vvHeight = vv && Object.getOwnPropertyDescriptor(Object.getPrototypeOf(vv), 'height');
        if (vvHeight && vvHeight.get) {
          Object.defineProperty(vv, 'height', {
            configurable: true,
            get: function () { return vvHeight.get.call(this) + shortfall(window.innerHeight); }
          });
        }
        root.classList.add('ios-webapp-full-height');
      } catch (_) { }

      // iOS 26+ installed web app: the system draws a blurred band (tinted with
      // the page background) from the top of the screen to about 35pt past the
      // status bar, over whatever the page puts there; the page cannot remove
      // or shorten it. Report a taller top safe-area inset to Flutter so app
      // bars, which pad by it, start below the dense part of that band. The
      // engine reads the inset back from its probe element with
      // getComputedStyle, so only that element's padding-top is adjusted.
      // Safari freezes the OS version in its UA, but "Version/<n>" follows iOS.
      try {
        var safari = /Version\/(\d+)/.exec(navigator.userAgent);
        if (safari && +safari[1] >= 26) {
          var edgeEffectOverhang = 24;
          var getComputedStyle = window.getComputedStyle;
          window.getComputedStyle = function (element) {
            var style = getComputedStyle.apply(window, arguments);
            if (!element || !element.hasAttribute ||
                !element.hasAttribute('flt-safe-area-probe')) {
              return style;
            }
            return new Proxy(style, {
              get: function (target, name) {
                if (name === 'getPropertyValue') {
                  return function (property) {
                    var value = target.getPropertyValue(property);
                    var top = parseFloat(value);
                    return property === 'padding-top' && top > 0
                      ? (top + edgeEffectOverhang) + 'px' : value;
                  };
                }
                var member = target[name];
                return typeof member === 'function' ? member.bind(target) : member;
              }
            });
          };
        }
      } catch (_) { }
    })();
  </script>
